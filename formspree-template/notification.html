<div class="email-shell">
  <div class="email-card">
    <div class="email-header">
      <p class="eyebrow">CALLED FOR MORE</p>
      <h1>A reader shared a testimony</h1>
      <p class="header-caption">A note from your devotional community</p>
    </div>

    <div class="email-content">
      <p class="section-label">READER</p>
      <p class="reader-name">{{name}}</p>

      <p class="section-label story-label">THEIR TESTIMONY</p>
      <div class="story-card">
        <p class="story-text">{{story}}</p>
      </div>

      <div class="email-meta">
        <p>Received {{_time}}</p>
        <p>Sent from {{_host}}</p>
      </div>
    </div>

    <div class="email-footer">
      <span class="footer-star">✳</span>
      <p class="footer-title">Called for More</p>
      <p class="footer-subtitle">A 30-Day Devotional by Okosun Rhoda</p>
      <p class="footer-link"><a href="https://www.instagram.com/iamokosun_rhoda/">Follow Rhoda on Instagram ↗</a></p>
      <p class="unsubscribe"><a href="{{_unsubscribe}}">Unsubscribe from these notifications</a></p>
    </div>
  </div>
</div>
